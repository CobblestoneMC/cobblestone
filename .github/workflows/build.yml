name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    working-directory: project

permissions:
  contents: read

jobs:
  validate-wrapper:
    name: Validate Gradle wrapper
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: gradle/actions/wrapper-validation@v6
        with:
          min-wrapper-count: 1

  format:
    name: Format
    needs: validate-wrapper
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: |
            21
            25
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew spotlessCheck --stacktrace

  build:
    name: Build
    needs: validate-wrapper
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: |
            21
            25
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew build -x spotlessCheck --stacktrace
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-${{ github.sha }}
          path: project/**/build/reports/tests/
          retention-days: 7
      - name: Upload plugin jars
        uses: actions/upload-artifact@v7
        with:
          name: cobblestone-${{ github.sha }}
          path: |
            project/minecraft/**/build/libs/Cobblestone*.jar
            !project/**/*-sources.jar
            !project/**/*-javadoc.jar
          if-no-files-found: error
          retention-days: 7
