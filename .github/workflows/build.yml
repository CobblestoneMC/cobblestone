name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    working-directory: project

permissions:
  contents: read

jobs:
  validate-wrapper:
    name: Validate Gradle wrapper
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: gradle/actions/wrapper-validation@v6
        with:
          min-wrapper-count: 1

  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: |
            21
            25
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew spotlessCheck --stacktrace

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: |
            21
            25
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew build -x spotlessCheck --stacktrace
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: project/**/build/reports/tests/
          retention-days: 7

  artifacts:
    name: Artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: |
            21
            25
      - uses: gradle/actions/setup-gradle@v6
      - name: Build shaded plugin jars
        run: |
          ./gradlew \
            :minecraft:platform:paper:paper-plugin:shadowJar \
            :minecraft:platform:sponge-12:sponge-12-plugin:shadowJar \
            --stacktrace
      - name: Upload Paper plugin
        uses: actions/upload-artifact@v7
        with:
          name: Odyssey-Paper
          path: project/minecraft/platform/paper/plugin/build/libs/Odyssey-Paper-*-all.jar
          if-no-files-found: error
      - name: Upload Sponge plugin
        uses: actions/upload-artifact@v7
        with:
          name: Odyssey-Sponge
          path: project/minecraft/platform/sponge-12/plugin/build/libs/Odyssey-Sponge-*-all.jar
          if-no-files-found: error
