<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" role="img" aria-label="A code window plugging into Cobblestone's navigation API">
  <ellipse cx="200" cy="232" rx="150" ry="18" fill="#4aa8ff" fill-opacity="0.12"/>

  <!-- code window -->
  <g>
    <rect x="34" y="52" width="230" height="160" rx="10" fill="#a8c0d4"/>
    <rect x="34" y="52" width="230" height="26" rx="10" fill="#2a6fb5"/>
    <circle cx="50" cy="65" r="4" fill="#ffc857"/>
    <circle cx="64" cy="65" r="4" fill="#d9ecff" fill-opacity="0.7"/>

    <g fill="#5d7690">
      <rect x="54" y="96" width="60" height="9" rx="4.5"/>
      <rect x="120" y="96" width="94" height="9" rx="4.5" fill="#2a6fb5"/>
      <rect x="66" y="116" width="104" height="9" rx="4.5"/>
      <rect x="176" y="116" width="48" height="9" rx="4.5" fill="#ffc857"/>
      <rect x="66" y="136" width="72" height="9" rx="4.5" fill="#2a6fb5"/>
      <rect x="144" y="136" width="86" height="9" rx="4.5"/>
      <rect x="54" y="156" width="46" height="9" rx="4.5"/>
      <rect x="66" y="176" width="128" height="9" rx="4.5" fill="#4aa8ff"/>
    </g>
  </g>

  <!-- connector -->
  <path d="M264 132h34" stroke="#4aa8ff" stroke-width="6" stroke-linecap="round"/>
  <circle cx="302" cy="132" r="7" fill="#4aa8ff"/>

  <!-- cobblestone block with route glyph -->
  <g>
    <rect x="296" y="86" width="82" height="92" rx="10" fill="#7f97ad"/>
    <rect x="306" y="96" width="30" height="20" rx="4" fill="#9db4c8"/>
    <rect x="342" y="96" width="26" height="20" rx="4" fill="#8fa8bf"/>
    <rect x="306" y="122" width="26" height="20" rx="4" fill="#8fa8bf"/>
    <rect x="338" y="122" width="30" height="20" rx="4" fill="#9db4c8"/>
    <path d="M310 162c14-10 26 6 40-4" stroke="#ffc857" stroke-width="4"
          fill="none" stroke-linecap="round" stroke-dasharray="1 8"/>
    <circle cx="362" cy="156" r="5" fill="#ffc857"/>
  </g>
</svg>
