name: OdysseyWarps
version: '0.1.0-SNAPSHOT'
description: Example Odyssey integration — surfaces named /warp points as navigable routes.
author: whimxiqal
website: https://github.com/whimxiqal/Odyssey
main: net.whimxiqal.odyssey.example.warps.OdysseyWarpsPlugin
api-version: '1.21'
folia-supported: true
# We register our PaperTransitionProvider into Odyssey's service and use its API types, so Odyssey must
# be present and loaded first. A hard dependency guarantees both.
dependencies:
  server:
    odyssey:
      load: BEFORE
