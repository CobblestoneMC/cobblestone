name: odyssey
version: $projectVersion
description: A Minecraft navigation plugin.
author: whimxiqal
website: https://github.com/whimxiqal/Odyssey
main: net.whimxiqal.odyssey.paper.plugin.OdysseyPaperPlugin
loader: net.whimxiqal.odyssey.paper.plugin.PaperOdysseyLoader
api-version: '1.21'
folia-supported: true

permissions:
  odyssey.navigate:
    description: "Use of /navigate and the trip commands that manage its results"
    default: true
  odyssey.navigator:
    description: "Use of custom navigators (the parent of odyssey.navigator.<id>)"
    default: true
  odyssey.waypoint:
    description: "Use of personal waypoints"
    default: true
  odyssey.admin.reload:
    description: "Reload the Odyssey configuration"
    default: op
  odyssey.admin.portals:
    description: "Clear discovered portals"
    default: op
  odyssey.admin.waypoint.global:
    description: "Manage server-wide waypoints (-global)"
    default: op
