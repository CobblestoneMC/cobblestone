name: odyssey
version: $projectVersion
description: A Minecraft navigation plugin.
author: whimxiqal
website: https://github.com/whimxiqal/Odyssey
main: net.whimxiqal.odyssey.paper.plugin.OdysseyPaperPlugin
loader: net.whimxiqal.odyssey.paper.plugin.PaperOdysseyLoader
api-version: '1.21'
folia-supported: true

permissions:
  odyssey.navigate:
    description: "Use of /navigate"
    default: true
  odyssey.navigator:
    description: "Use of custom navigators"
    default: true
  odyssey.waypoint:
    description: "Use of waypoints"
    default: true
  odyssey.admin:
    description: "Use of administrative Odyssey commands"
    default: op
