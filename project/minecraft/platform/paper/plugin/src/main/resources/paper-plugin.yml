name: cobblestone
version: $projectVersion
description: A Minecraft navigation plugin.
author: whimxiqal
website: https://cobblestonemc.org
main: org.cobblestonemc.paper.plugin.CobblestonePaperPlugin
loader: org.cobblestonemc.paper.plugin.CobblestonePaperLoader
api-version: '1.21'
folia-supported: true

permissions:
  cobblestone.navigate:
    description: "Use of /navigate and the trip commands that manage its results"
    default: true
  cobblestone.navigator:
    description: "Use of custom navigators (the parent of cobblestone.navigator.<id>)"
    default: true
  cobblestone.location:
    description: "Use of personal locations"
    default: true
  cobblestone.admin.reload:
    description: "Reload the Cobblestone configuration"
    default: op
  cobblestone.admin.portals:
    description: "Clear discovered portals"
    default: op
  cobblestone.admin.location.global:
    description: "Manage server-wide locations (-global)"
    default: op
