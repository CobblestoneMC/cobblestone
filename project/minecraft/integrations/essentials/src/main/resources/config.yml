# CobblestoneEssentials — connects EssentialsX to Cobblestone.
#
# How Essentials' destinations look in Cobblestone's navigation menu (/navigate on its own). Each
# item is an item key ("minecraft:oak_sign") or "head:" followed by a skin texture value, as head
# databases such as minecraft-heads.com publish them. Restart the server after changing this file.
#
# Bedrock players only see a textured head's skin if it is also listed in Geyser's
# custom-skulls.yml; otherwise it shows as a plain head.
icons:
  # Essentials' own entry at the top of the menu.
  root: "minecraft:oak_door"
  # The list of your homes, and each home. The default is a little wooden house.
  homes: "head:eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvNjNkMDJjZGMwNzViYjFjYzVmNmZlM2M3NzExYWU0OTc3ZTM4YjkxMGQ1MGVkNjAyM2RmNzM5MTNlNWU3ZmNmZiJ9fX0="
  home: "head:eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvNjNkMDJjZGMwNzViYjFjYzVmNmZlM2M3NzExYWU0OTc3ZTM4YjkxMGQ1MGVkNjAyM2RmNzM5MTNlNWU3ZmNmZiJ9fX0="
  # The server spawn (with EssentialsSpawn).
  spawn: "minecraft:beacon"
