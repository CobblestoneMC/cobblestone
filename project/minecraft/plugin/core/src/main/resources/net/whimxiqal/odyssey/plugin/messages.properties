# ============================================================================================
#  Odyssey - English messages (default bundle)
#
#  Placeholders:
#    {1}, {2}, {3}  ->  the 1st, 2nd, 3rd parameter supplied by the code. Each is shown in the
#                       highlight (secondary) color automatically. Keep the braces intact.
#
#  Color/tone (informational gray, success green, error red) and the "[*]" prefix are applied
#  by the code, not here - just write the plain wording.
#
#  To translate Odyssey, copy this file to messages_<locale>.properties (e.g. messages_fr.properties)
#  and translate the right-hand side of each entry only.
# ============================================================================================

# --- General command feedback ---
command.no_permission=You don't have permission to do that.
command.players_only=Only a player can use that command.
command.unknown_subcommand=Unknown subcommand: {0}

# --- /odyssey ---
command.odyssey.usage=Usage: {0}
command.odyssey.reload.success=Odyssey configuration reloaded.
command.odyssey.reload.restart_required=Some settings changed but need a server restart to apply: {0}
# Help descriptions only; the command syntax is rendered from code (commands are the same in every
# language), so translators change just the description text on the right.
command.odyssey.help.header=Odyssey commands:
command.odyssey.help.reload=reload the configuration
command.odyssey.help.cancel=cancel a trip by id, or all of them
command.odyssey.help.trips=list your active trips
command.odyssey.help.portals=clear discovered portal links
command.odyssey.help.waypoint=save, remove, or list waypoints

# --- /odyssey waypoint ---
command.odyssey.waypoint.set=Waypoint {0} saved at your location.
command.odyssey.waypoint.unset=Waypoint {0} removed.
command.odyssey.waypoint.not_found=You have no waypoint named {0}.
command.odyssey.waypoint.store_error=Could not save your waypoint; check the server log.
command.odyssey.waypoint.list.header=Waypoints ({0}):
command.odyssey.waypoint.list.entry={0} - {1}
command.odyssey.waypoint.list.global={0} - {1} (global)
command.odyssey.waypoint.list.none=You have no waypoints.

# --- /navigate ---
command.navigate.searching=Searching for a route...
command.navigate.started=Success!
command.navigate.stats=Calculated in {0} ms; estimated {1}
command.navigate.no_route=There is no route to that destination.
command.navigate.limit_exceeded=The search ran out of resources before finding a route.
command.navigate.timed_out=The search took too long and was stopped.
command.navigate.error=The search failed unexpectedly; check the server log.
command.navigate.destination_not_found=No destination matches {0}.
command.navigate.destination_ambiguous=That destination is ambiguous; be more specific: {0}
command.navigate.unknown_navigator=Unknown navigator: {0}
command.navigate.trip_limit=You already have too many active trips; cancel one first.
command.navigate.flag.unknown=Unknown flag: {0}
command.navigate.flag.missing_value=Flag {0} needs a value.
command.navigate.flag.unknown_mode=Unknown mode: {0}
command.navigate.help.header=Navigate usage:
command.navigate.help.destination=where to go (a waypoint or provider path; tab-complete it)
command.navigate.help.navigator=choose the display style (default: trail)
command.navigate.help.no_mode=exclude a travel mode (also -no-fly, -no-boat, etc.)
command.navigate.help.no_world=exclude a world or dimension from routing
command.navigate.help.live=keep recalculating the route as you move

# --- /odyssey cancel & trips ---
command.odyssey.cancel.done=Canceled {0} active trip(s) and search(es).
command.odyssey.cancel.trip=Canceled trip {0}.
command.odyssey.cancel.not_found=You have no active trip with id {0}.
command.odyssey.cancel.nothing=You have nothing to cancel.
command.odyssey.trips.header=Active trips ({0}):
command.odyssey.trips.entry=[{0}] {1} - {2}
command.odyssey.trips.none=You have no active trips.
command.odyssey.portals.cleared=Cleared {0} discovered portal transitions.

# --- Duration units (for human-readable trip times) ---
format.duration.minutes=minutes
format.duration.seconds=seconds
format.duration.and=and

# --- Navigators ---
navigator.trail.prompt.command=Run {0}.
navigator.trail.prompt.action=Perform the highlighted action to continue along the trail.
