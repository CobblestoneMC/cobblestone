# The world the benchmark corpus is generated from.
#
# Terrain is a deterministic function of the seed *within a Minecraft version*, so the version is
# part of the corpus's identity: regenerating against a different one silently produces different
# terrain and makes every baseline mean something else. captureCorpus pins the Paper build.
seed: 8450468245224589493
minecraftVersion: "26.2"
paperBuild: 129

# Captures that cannot come from a seed, because they were built by hand. These are committed as
# .sbc data rather than regenerated; they are small, and there is no other way to get them back.
handBuilt: []
