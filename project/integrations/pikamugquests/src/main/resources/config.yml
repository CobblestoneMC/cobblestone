# CobblestoneQuests — guide players to their Quests objectives.
#
# When a quest's compass target updates for a player (accepting a quest, advancing a stage, an
# objective moving), CobblestoneQuests can start a guided Cobblestone trip to that objective. Each active
# quest's current locatable objective is also offered as a `/navigate quest <name>` destination.

# Whether to automatically start a trip when a quest's compass target updates. Players who never use
# the vanilla quest compass simply never trigger this. Individual quests can override below.
auto-navigate: true

# The navigator (display style) to guide quest trips with. "trail" is Cobblestone's built-in particle
# trail; particles/colors below only apply to it.
navigator: trail

# The particle types the trail is drawn with (only DUST is colored). Bukkit Particle names.
particles:
  - SCRAPE
  - WAX_OFF

# The colors DUST particles are randomly drawn in, as RRGGBB hex.
colors:
  - FFD54F
  - 4FC3F7

# Per-quest overrides, keyed by the quest's id (its file name, e.g. the `id:` in the quest yml).
# Any field left out falls back to the global setting above.
#
# quests:
#   slay-the-dragon:
#     enabled: false          # never auto-navigate this quest
#   deliver-the-bread:
#     colors:
#       - E57373
quests: {}
