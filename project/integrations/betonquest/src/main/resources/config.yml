# OdysseyBetonQuest — guide players to their BetonQuest quest-compass targets.
#
# When a player sets their quest compass to a target (via the compass item or command),
# OdysseyBetonQuest can start a guided Odyssey trip there. Each of the player's active quest compasses
# is also offered as a `/navigate compass <name>` destination.

# Whether to automatically start a trip when a player sets their quest compass. Individual compasses
# can override below.
auto-navigate: true

# The navigator (display style) to guide compass trips with. "trail" is Odyssey's built-in particle
# trail; particles/colors below only apply to it.
navigator: trail

# The particle types the trail is drawn with (only DUST is colored). Bukkit Particle names.
particles:
  - DUST
  - GLOW

# The colors DUST particles are randomly drawn in, as RRGGBB hex.
colors:
  - FFD54F
  - 4FC3F7

# Per-compass overrides, keyed by the compass' name (its id in the quest package). Any field left
# out falls back to the global setting above.
#
# compasses:
#   dungeon_entrance:
#     enabled: false          # never auto-navigate this compass
#   village:
#     colors:
#       - E57373
compasses: {}
